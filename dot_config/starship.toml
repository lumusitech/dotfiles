# ~/.config/starship.toml
# Configuración estándar / default de Starship

# Inserta una línea en blanco entre ejecuciones de comandos
add_newline = true

# Formato principal: muestra usuario, host, directorio, git, lenguajes/entornos, estado y prompt char
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$package\
$c\
$cmake\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$java\
$lua\
$nodejs\
$python\
$ruby\
$rust\
$scala\
$docker_context\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$character"""

# Formato del prompt a la derecha (si se usa)
right_format = """"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"

[deno]
symbol = " "
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
format = "via [$symbol($version )]($style)"

[java]
symbol = " "
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "

[package]
symbol = "󰏗 "
format = "is [$symbol$version]($style) "

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
