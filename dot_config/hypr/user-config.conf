# ==============================================================================
# CachyOS / Arch Linux - Hyprland User Customizations
# Sourced by ~/.config/hypr/hyprland.conf or ~/.config/hypr/config/user-config.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MONITORES (ASUS VA27EHE @ 75Hz con VRR / FreeSync)
# ------------------------------------------------------------------------------
monitor = desc:ASUSTek COMPUTER INC ASUS VA27EHE L8LMTF116411, 1920x1080@75, 0x0, 1, vrr, 1
monitor = , preferred, auto, 1

# ------------------------------------------------------------------------------
# 2. TECLADO, RATÓN Y ENTRADA
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    kb_variant = altgr-intl
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0.35
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

# ------------------------------------------------------------------------------
# 3. DECORACIONES Y APARIENCIA
# ------------------------------------------------------------------------------
decoration {
    rounding = 8
    dim_inactive = true
    dim_strength = 0.25
}

# ------------------------------------------------------------------------------
# 4. REGLAS DE VENTANAS (Scratchpads flotantes dedicados)
# ------------------------------------------------------------------------------
# YouTube Music
windowrulev2 = workspace special:music, class:^(chrome-music.youtube.com__-Default)$
windowrulev2 = float, class:^(chrome-music.youtube.com__-Default)$
windowrulev2 = size 1200 750, class:^(chrome-music.youtube.com__-Default)$
windowrulev2 = center, class:^(chrome-music.youtube.com__-Default)$

# Cliamp (reproductor de música terminal)
windowrulev2 = workspace special:cliamp, class:^(cliamp-scratchpad)$
windowrulev2 = float, class:^(cliamp-scratchpad)$
windowrulev2 = size 900 550, class:^(cliamp-scratchpad)$
windowrulev2 = center, class:^(cliamp-scratchpad)$

# Calculadora (CachyOS / Arch Linux nativa: KCalc, Qalculate, GNOME Calculator, Galculator)
windowrulev2 = workspace special:calc, class:(.*calc.*|.*qalculate.*|.*galculator.*)
windowrulev2 = float, class:(.*calc.*|.*qalculate.*|.*galculator.*)
windowrulev2 = size 420 620, class:(.*calc.*|.*qalculate.*|.*galculator.*)
windowrulev2 = center, class:(.*calc.*|.*qalculate.*|.*galculator.*)

# ------------------------------------------------------------------------------
# 5. ATAJOS DE TECLADO PERSONALIZADOS (Scratchpads & WebApps)
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Scratchpads
bind = $mainMod, M, exec, ~/.local/bin/toggle-ytmusic
bind = $mainMod ALT, C, exec, ~/.local/bin/toggle-calc
bind = $mainMod, R, exec, ~/.local/bin/toggle-cliamp

# WebApps (Ventanas estándar con soporte completo de drag & drop desde el gestor de archivos)
bind = $mainMod SHIFT, A, exec, ~/.local/bin/launch-webapp https://gemini.google.com/
bind = $mainMod SHIFT, W, exec, ~/.local/bin/launch-webapp https://web.whatsapp.com/

# Voxtype (Dictado por voz Push-to-Talk y Traducción local con Whisper)
bind = , F9, exec, voxtype record start
bindr = , F9, exec, voxtype record stop
bind = , F10, exec, voxtype record start --profile translate
bindr = , F10, exec, voxtype record stop

